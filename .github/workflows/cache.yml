name: Build Cache [using jupyter-book]
on:
  schedule:
    # Execute cache weekly at 3am on Monday
    - cron:  '0 3 * * 1'
  workflow_dispatch:
jobs:
  cache:
    runs-on: "runs-on=${{ github.run_id }}/family=g4dn.2xlarge/image=quantecon_ubuntu2404/volume=80gb/spot=false"
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Setup Anaconda
        uses: conda-incubator/setup-miniconda@v4
        with:
          auto-update-conda: true
          auto-activate-base: true
          miniconda-version: 'latest'
          python-version: "3.13"
          environment-file: environment.yml
          activate-environment: quantecon
      - name: Install jax (and install checks for GPU)
        shell: bash -l {0}
        run: |
          # Pinned to the lecture baseline, QuantEcon/lectures' _base/environment-update.yml.
          pip install "jax[cuda13]==0.12.1"
          python --version
          python scripts/test-jax-install.py
          nvidia-smi
      - name: Build matplotlib's font cache
        shell: bash -l {0}
        run: |
          # On a freshly launched runner the first matplotlib import scans the
          # system fonts from a cold disk, which can take over 5 s, and
          # matplotlib then prints "Matplotlib is building the font cache; this
          # may take a moment." into the output of the first notebook that
          # imports it. Build the cache here, so no page depends on that timing:
          # the font manager builds it on import, with no backend involved.
          python -c "import matplotlib.font_manager"
      - name: Install ImageMagick
        # A freshly launched machine can still be running unattended-upgrades,
        # which holds the dpkg lock: wait for it (up to 10 minutes) instead of failing.
        run: sudo apt-get update && sudo apt-get -o DPkg::Lock::Timeout=600 install -y imagemagick
      - name: Build HTML
        shell: bash -l {0}
        run: |
          jb build lectures --path-output ./ -W --keep-going
      - name: Upload Execution Reports
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: execution-reports
          path: _build/html/reports
      - name: Upload "_build" folder (cache)
        uses: actions/upload-artifact@v7
        with:
          name: build-cache
          path: _build
          include-hidden-files: true